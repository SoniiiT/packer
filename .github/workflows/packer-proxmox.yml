name: Packer Build on Proxmox

on:
  push:
    paths:
      - 'Proxmox/**'
  pull_request:
    paths:
      - 'Proxmox/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      run_build: ${{ steps.set-matrix.outputs.run_build }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "latest"

      - name: Find Template Directories
        id: find-dirs
        run: |
          DIRS=$(find Proxmox/* -type d -maxdepth 0 -print0 | xargs -0 -I {} basename {} | jq -R . | jq -sc .)
          echo "Found directories: $DIRS"
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"

      - name: Set Build Matrix
        id: set-matrix
        run: |
          ALL_DIRS='${{ steps.find-dirs.outputs.dirs }}'
          
          echo "Event: ${{ github.event_name }}"
          
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            CHANGES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          elif [ "${{ github.event_name }}" == "push" ]; then
            if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
               git fetch origin main
               CHANGES=$(git diff --name-only origin/main HEAD)
            else
               CHANGES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
            fi
          else
            CHANGES="ALL"
          fi
          
          echo "Changed files:"
          echo "$CHANGES"

          if [ "$CHANGES" == "ALL" ]; then
            MATRIX=$ALL_DIRS
          else
            BUILD_LIST=()
            for dir in $(echo $ALL_DIRS | jq -r '.[]'); do
              if echo "$CHANGES" | grep -q "^Proxmox/$dir/"; then
                BUILD_LIST+=("$dir")
              fi
            done
            
            if [ ${#BUILD_LIST[@]} -eq 0 ]; then
              MATRIX="[]"
            else
              MATRIX=$(printf '%s\n' "${BUILD_LIST[@]}" | jq -R . | jq -sc .)
            fi
          fi
          
          echo "Calculated matrix: $MATRIX"
          echo "matrix={\"template\":$MATRIX}" >> "$GITHUB_OUTPUT"
          
          if [ "$MATRIX" == "[]" ]; then
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Validate Templates
        env:
          PKR_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          PKR_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          PKR_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          PKR_VAR_ssh_private_key_file: ${{ github.workspace }}/private_key.pem
        run: |
          for dir in $(echo '${{ steps.find-dirs.outputs.dirs }}' | jq -r '.[]'); do
            echo "Validating template in Proxmox/$dir"
            cd "Proxmox/$dir"
            packer init .
            packer validate .
            cd ../..
          done
      
      - name: Cleanup SSH Key
        if: always()
        run: rm -f private_key.pem

  build:
    needs: validate
    if: needs.validate.outputs.run_build == 'true'
    runs-on: self-hosted
    strategy:
      matrix: ${{fromJson(needs.validate.outputs.matrix)}}
      fail-fast: false
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "latest"

      - name: Create SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Build Template
        env:
          PKR_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          PKR_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          PKR_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          PKR_VAR_ssh_private_key_file: ${{ github.workspace }}/private_key.pem
        run: |
          echo "Building template in Proxmox/${{ matrix.template }}"
          cd "Proxmox/${{ matrix.template }}"
          packer init .
          packer build .
          cd ../..

      - name: Cleanup SSH Key
        if: always()
        run: rm -f private_key.pem 