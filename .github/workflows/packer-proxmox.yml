name: Packer Build on Proxmox

on:
  push:
    paths:
      - 'Proxmox/**'
  pull_request:
    paths:
      - 'Proxmox/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      - name: Find Template Directories
        id: find-dirs
        run: |
          DIRS=$(find Proxmox/* -type d -maxdepth 0 -print0 | xargs -0 -I {} basename {} | jq -R . | jq -sc .)
          echo "Found directories: $DIRS"
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"

      - name: Set Build Matrix
        id: set-matrix
        run: |
          echo "matrix={\"template\":$(echo '${{ steps.find-dirs.outputs.dirs }}' | jq -c .)}" >> "$GITHUB_OUTPUT"

      - name: Create SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Validate Templates
        env:
          PKR_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          PKR_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          PKR_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          PKR_VAR_ssh_private_key_file: ${{ github.workspace }}/private_key.pem
        run: |
          for dir in $(echo '${{ steps.find-dirs.outputs.dirs }}' | jq -r '.[]'); do
            echo "Validating template in Proxmox/$dir"
            cd "Proxmox/$dir"
            packer init .
            packer validate .
            cd ../..
          done
      
      - name: Cleanup SSH Key
        if: always()
        run: rm -f private_key.pem

  build:
    needs: validate
    runs-on: self-hosted
    strategy:
      matrix: ${{fromJson(needs.validate.outputs.matrix)}}
      fail-fast: false
    
    if: github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      - name: Check if Directory Changed
        id: changed
        run: |
          echo "Event: ${{ github.event_name }}"
          
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            CHANGES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          elif [ "${{ github.event_name }}" == "push" ]; then
            if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
               # New branch push, compare against main
               git fetch origin main
               CHANGES=$(git diff --name-only origin/main HEAD)
            else
               CHANGES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
            fi
          else
            # Manual run or other - build everything
            CHANGES="Proxmox/${{ matrix.template }}/force_build"
          fi
          
          echo "Changed files:"
          echo "$CHANGES"

          if echo "$CHANGES" | grep -q "^Proxmox/${{ matrix.template }}/"; then
            echo "Directory has changed, will build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "No changes in directory, skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Create SSH Key
        if: steps.changed.outputs.should_build == 'true'
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Build Template
        if: steps.changed.outputs.should_build == 'true'
        env:
          PKR_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          PKR_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          PKR_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          PKR_VAR_ssh_private_key_file: ${{ github.workspace }}/private_key.pem
        run: |
          echo "Building template in Proxmox/${{ matrix.template }}"
          cd "Proxmox/${{ matrix.template }}"
          packer init .
          packer build .
          cd ../..

      - name: Cleanup SSH Key
        if: always()
        run: rm -f private_key.pem

      - name: Skip Build
        if: steps.changed.outputs.should_build == 'false'
        run: |
          echo "No changes detected in Proxmox/${{ matrix.template }}, skipping build"

      - name: Mark job as success if skipped
        if: steps.changed.outputs.should_build == 'false'
        run: exit 0 